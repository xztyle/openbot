# The Atelier mail Worker. Email Routing sends each agent address to it (the `email` handler), and the
# host calls its `/send` to answer (the `fetch` handler). See README.md for the deploy steps.
name = "atelier-mail"
main = "src/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
# The host calls https://atelier-mail.<account subdomain>.workers.dev/send. Replace it with a custom
# domain route if you prefer one.
workers_dev = true
preview_urls = false

# Vars: HOST_INBOX_URL (the host's webhook inbox for mail: Settings → Secrets → Agent mailboxes) and
# SENDER_DOMAINS (the domains agents may send from, comma-separated). They are not in this file, so a
# deploy never replaces the live values with placeholders: `bun run deploy` (`--keep-vars`) keeps
# them. Set them on the first deploy, or to change them:
#   bunx wrangler deploy --keep-vars --var HOST_INBOX_URL:https://connect.<domain>/hooks/mail_… \
#     --var SENDER_DOMAINS:aprendivo.com

# Cloudflare Email Sending. Set the secret with `wrangler secret put MAIL_SECRET`.
[[send_email]]
name = "EMAIL"
