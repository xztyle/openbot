# OpenBot as a self-hosted server in Docker. See docs/docker.md.
#
#   curl -fsSLO https://raw.githubusercontent.com/nightly-labs/openbot/main/docker/compose.yaml
#   curl -fsSLO https://raw.githubusercontent.com/nightly-labs/openbot/main/docker/seccomp.json
#   docker compose up -d
#   docker compose exec openbot openbot login
services:
  openbot:
    # Use a version tag to choose when to upgrade. OpenBot never goes back to an older version.
    image: ghcr.io/nightly-labs/openbot:latest
    restart: unless-stopped
    security_opt:
      # The Docker default profile, with user namespaces for the Electron sandbox.
      - seccomp=./seccomp.json
      - no-new-privileges:true
    # Chromium uses shared memory. The Docker default of 64 MB is too small.
    shm_size: 1g
    # OpenBot stops its agents and closes the database before it exits.
    stop_grace_period: 60s
    volumes:
      - openbot-data:/data
    # Docker keeps the log without a limit by default. This keeps the last 30 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # The image has a health check (`openbot health`). Docker marks the container healthy or
    # unhealthy and does not restart it.
    # OpenBot only connects out. It needs no published port.
    # environment:
    #   XAI_API_KEY: ${XAI_API_KEY}
    #   OPENBOT_ANALYTICS: "off"          # no product analytics on this server
    #   OPENBOT_LOG_LEVEL: info           # trace, debug, info, warn, error or silent
    #   OPENBOT_SILENT_TURN_MINUTES: "30" # warn in the log when a turn gets no output for this long

volumes:
  openbot-data:
