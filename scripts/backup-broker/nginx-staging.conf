# Staging copy's screen (noVNC on 127.0.0.1:20120, from `backupd.py staging up`). Not installed.
# The VNC has no password of its own: install this ONLY after a Cloudflare Access application for
# staging.delynith.com exists (README.md, "Staging"). Cloudflare and loopback only, as for Motion.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /opt/openbot/apps/tls/origin.pem;
    ssl_certificate_key /opt/openbot/apps/tls/origin.key;
    server_name staging.delynith.com;
    access_log /var/log/nginx/staging-access.log openbot_apps_safe;

    if ($openbot_apps_allowed = 0) { return 444; }

    location = / { return 302 /vnc.html?autoconnect=1&resize=remote&path=websockify; }
    location / {
        proxy_pass http://127.0.0.1:20120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openbot_apps_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name staging.delynith.com;
    if ($openbot_apps_allowed = 0) { return 444; }
    return 301 https://$host$request_uri;
}
