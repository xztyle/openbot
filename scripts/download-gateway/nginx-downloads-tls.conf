# Step 2 of the download host: https. Install as /etc/nginx/conf.d/openbot-downloads.conf in place of
# nginx-downloads.conf, after the certificate exists:
#
#   sudo certbot certonly --webroot -w /var/www/openbot-acme -d dl.delynith.com \
#     --cert-name openbot-downloads --deploy-hook "systemctl reload nginx"
#
# A ticket is a bearer link: port 80 only answers the certificate challenge and redirects.

limit_conn_zone $binary_remote_addr zone=openbot_dl:10m;

server {
    listen 80;
    listen [::]:80;
    server_name dl.delynith.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/openbot-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dl.delynith.com;
    ssl_certificate /etc/letsencrypt/live/openbot-downloads/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openbot-downloads/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The address holds a ticket. Log nothing about it.
    access_log off;

    location ~ ^/d/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ {
        limit_conn openbot_dl 8;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8451;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location / { return 404; }
}
