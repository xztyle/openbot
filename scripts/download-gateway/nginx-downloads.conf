# OpenBot download host: streams one file per signed ticket from the local download gateway.
# Install as /etc/nginx/conf.d/openbot-downloads.conf. The name must be a DNS-only record that points
# at this host (no Cloudflare proxy: large video through the free proxy breaks its terms).
#
# Step 1 (this file as it is): port 80, so the certificate can be issued and the path can be tested.
# Step 2: after `certbot ... --expand -d dl.delynith.com`, the 443 block below is used and port 80
# redirects to it. A ticket is a bearer link, so it must never be served over plain http.

limit_conn_zone $binary_remote_addr zone=openbot_dl:10m;

server {
    listen 80;
    listen [::]:80;
    server_name dl.delynith.com;
    # The address holds a ticket. Log nothing about it.
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/openbot-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ ^/d/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ {
        limit_conn openbot_dl 8;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8451;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location / { return 404; }
}
